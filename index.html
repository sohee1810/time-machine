<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>타임머신 수리 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Square+Round:wght@400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a26;--panel:#1e2636;--panel2:#273249;--rim:#3a4762;
  --brass:#e6a23c;--brass-d:#c9822a;--orange:#e67e22;
  --glow:#5ee6c8;--glow-d:#2bb39a;--red:#ff5d5d;--ok:#52d68a;
  --paper:#fffdf9;--ink:#342e2b;--muted:#8c7b70;--line:#eae0d0;
  --txt:#e9edf5;--sub:#9aa6bd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Nanum Square Round',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  background-image:radial-gradient(circle at 50% -10%,#2a3550 0%,var(--bg) 60%);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit}
.mono{font-family:'Share Tech Mono',monospace;letter-spacing:.04em}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 20px;border-radius:12px;font-weight:800;font-size:1rem;transition:.15s}
.btn.brass{background:linear-gradient(180deg,var(--brass),var(--brass-d));color:#1b1408;box-shadow:0 4px 0 #8a5a1c,0 6px 16px rgba(230,162,60,.25)}
.btn.brass:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a1c}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--rim)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.full{width:100%}

/* 시작 화면 */
.intro{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.console{width:100%;max-width:440px;background:var(--panel);border:2px solid var(--rim);border-radius:22px;padding:28px 24px;
  box-shadow:0 0 0 6px #0e131c,0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);text-align:center;position:relative}
.console:before{content:'';position:absolute;inset:10px;border:1px dashed rgba(230,162,60,.25);border-radius:16px;pointer-events:none}
.eyebrow{font-size:.78rem;color:var(--brass);font-weight:800;letter-spacing:.12em}
.console h1{font-family:'Gowun Batang',serif;font-size:1.65rem;margin:8px 0 4px;color:#fff}
.console .story{font-family:'Gowun Batang',serif;color:var(--sub);font-size:.95rem;line-height:1.7;margin:14px 0 20px;word-break:keep-all}
.gauge{width:92px;height:92px;margin:6px auto 4px;border-radius:50%;border:4px solid var(--brass);position:relative;
  background:radial-gradient(circle,#0f1520 55%,#1a2335 100%);box-shadow:0 0 18px rgba(230,162,60,.3)}
.gauge:after{content:'';position:absolute;left:50%;top:50%;width:3px;height:36px;background:var(--red);transform-origin:50% 0;
  transform:rotate(200deg);border-radius:2px;animation:needle 2.4s ease-in-out infinite alternate}
.gauge span{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--brass);z-index:1}
@keyframes needle{from{transform:rotate(160deg)}to{transform:rotate(240deg)}}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;font-size:.82rem;color:var(--sub);margin-bottom:6px;font-weight:700}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid var(--rim);background:#0f1520;color:#fff;font-size:1.05rem;outline:none}
.inp:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(94,230,200,.15)}
.note{font-size:.8rem;color:var(--sub);margin-top:10px;line-height:1.5}

/* 상단 계기판 */
.dash{background:var(--panel);border:2px solid var(--rim);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 0 0 4px #0e131c}
.dash-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.team{font-weight:800;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team small{color:var(--sub);font-weight:700;font-size:.75rem;margin-left:6px}
.clock{background:#0b1018;border:1px solid var(--rim);border-radius:8px;padding:4px 10px;color:var(--glow);font-size:1.1rem;text-shadow:0 0 8px rgba(94,230,200,.6)}
.track{display:flex;align-items:center;gap:0;margin-bottom:12px}
.node{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;
  background:#0f1520;border:2px solid var(--rim);color:var(--sub)}
.node.done{background:var(--glow-d);border-color:var(--glow);color:#06221c}
.node.cur{border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 4px rgba(230,162,60,.2);animation:pulse 1.6s infinite}
.node.view{outline:3px solid #fff;outline-offset:2px}
.node.final{border-radius:10px}
.wire{flex:1;height:3px;background:var(--rim);min-width:4px}
.wire.done{background:var(--glow-d)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(230,162,60,0)}}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{background:#0b1018;border:1px dashed var(--rim);border-radius:8px;padding:7px 2px;text-align:center;font-size:.78rem;color:#4a5872;min-height:34px;
  display:flex;align-items:center;justify-content:center;word-break:break-all}
.slot.got{border:1px solid var(--brass);color:var(--brass);background:rgba(230,162,60,.08);font-weight:800}
.slot.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 스테이션 */
.st-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 10px;flex-wrap:wrap}
.st-head .no{color:var(--brass);font-size:1.4rem}
.st-head h2{font-size:1.15rem;font-weight:800}
.st-head .pg{color:var(--sub);font-size:.85rem}
.review-tag{background:var(--panel2);border:1px solid var(--rim);color:var(--sub);font-size:.75rem;padding:3px 8px;border-radius:20px}
.passage{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 18px;margin-bottom:14px;font-family:'Gowun Batang',serif;
  line-height:1.85;font-size:1rem;white-space:pre-wrap;word-break:keep-all;border-left:6px solid var(--orange)}
.passage.paper{font-family:'Nanum Square Round';background:#f3ece0;border-left-color:var(--brass);font-size:.95rem}
.mission{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;
  box-shadow:inset 0 0 0 2px var(--line)}
.mission.ok{box-shadow:inset 0 0 0 2px #9fe0bd;background:#f2fbf5}
.m-label{font-size:.75rem;font-weight:800;color:var(--orange);letter-spacing:.06em;margin-bottom:4px}
.mission.ok .m-label{color:#1e9e5a}
.m-q{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.08rem;line-height:1.5;margin-bottom:12px}
.m-row{display:flex;gap:8px}
.m-row .inp{background:#faf7f2;color:var(--ink);border-color:var(--line)}
.m-row .inp:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(230,126,34,.15)}
.m-row .btn{flex:none}
.solved{display:flex;align-items:center;gap:8px;font-weight:800;color:#1e9e5a}
.solved span{font-family:'Gowun Batang',serif;color:var(--ink);font-weight:700}
.ox-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.ox-item:first-of-type{border-top:0}
.ox-item p{flex:1;font-family:'Gowun Batang',serif;line-height:1.5}
.ox-item b{color:var(--muted);margin-right:4px}
.oxb{width:46px;height:42px;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:1.15rem;color:var(--muted);background:#fff}
.oxb.on.o{background:#3b82f6;border-color:#3b82f6;color:#fff}
.oxb.on.x{background:#ef4444;border-color:#ef4444;color:#fff}
.seq{display:grid;gap:6px;margin-bottom:10px}
.seq .sl{min-height:44px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;gap:8px;padding:8px 10px;color:#b5a99c;font-size:.9rem}
.seq .sl.fill{border-style:solid;border-color:var(--orange);color:var(--ink);background:#fff7ee;cursor:pointer;font-family:'Gowun Batang',serif}
.seq .sl i{font-style:normal;font-family:'Share Tech Mono';color:var(--orange);font-weight:700;flex:none;width:18px}
.deck{display:grid;gap:6px;margin-bottom:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-family:'Gowun Batang',serif;line-height:1.45;color:var(--ink)}
.card:active{transform:scale(.98)}
.card.used{opacity:.25;pointer-events:none}
.sub-hint{font-size:.8rem;color:var(--muted);margin-bottom:8px}

/* 대기·알림 */
.cool{position:sticky;top:8px;z-index:20;background:#2a1418;border:2px solid var(--red);border-radius:14px;padding:12px 14px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;box-shadow:0 0 24px rgba(255,93,93,.25)}
.cool .sec{font-size:2rem;color:var(--red);text-shadow:0 0 10px rgba(255,93,93,.6);min-width:62px;text-align:center}
.cool p{font-size:.9rem;line-height:1.4}
.cool p b{color:#ffb4b4}
.hint{background:#2b2412;border:1px solid var(--brass);color:#ffd99a;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.gate{background:var(--panel);border:2px dashed var(--brass);border-radius:18px;padding:30px 20px;text-align:center}
.gate .big{font-size:2.6rem;margin-bottom:8px}
.gate h3{font-size:1.15rem;margin-bottom:6px}
.gate p{color:var(--sub);font-size:.9rem}
.think{background:#22304a;border:1px solid #3c5480;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.think .m-label{color:#9cc0ff}
.think p{font-family:'Gowun Batang',serif;font-size:1.02rem;line-height:1.55}
.think small{display:block;color:var(--sub);margin-top:6px}
.next-row{display:flex;justify-content:flex-end;margin-top:6px}

.overlay{position:fixed;inset:0;background:rgba(6,9,14,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--brass);border-radius:20px;padding:26px 22px;text-align:center;animation:pop .45s}
.modal .ico{font-size:3rem}
.modal h3{font-size:1.25rem;margin:6px 0 10px}
.keyword{display:inline-block;font-size:1.8rem;color:var(--brass);border:2px solid var(--brass);border-radius:12px;padding:6px 18px;margin:6px 0 14px;
  text-shadow:0 0 12px rgba(230,162,60,.5);background:rgba(230,162,60,.08)}
.modal p{color:var(--sub);font-size:.92rem;line-height:1.6;margin-bottom:16px}
.modal .think{text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b1018;border:1px solid var(--rim);color:#fff;padding:11px 16px;border-radius:12px;
  z-index:60;font-size:.9rem;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* 최종 암호 */
.final-panel{background:var(--panel);border:2px solid var(--brass);border-radius:18px;padding:18px;box-shadow:0 0 30px rgba(230,162,60,.12)}
.final-panel h2{font-size:1.2rem;margin-bottom:4px}
.final-panel .desc{color:var(--sub);font-size:.9rem;margin-bottom:14px;line-height:1.5}
.code-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cs{background:#0b1018;border:2px dashed var(--rim);border-radius:10px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1rem}
.cs i{font-style:normal;font-size:.68rem;color:#4a5872}
.cs.fill{border:2px solid var(--glow);color:var(--glow);cursor:pointer;text-shadow:0 0 8px rgba(94,230,200,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.chip{padding:10px 16px;border-radius:30px;background:rgba(230,162,60,.12);border:2px solid var(--brass);color:var(--brass);font-weight:800}
.chip.used{opacity:.2;pointer-events:none}
.link{color:var(--sub);text-decoration:underline;font-size:.85rem;padding:6px}
.f-actions{display:flex;gap:8px}
.f-actions .btn{flex:1}

/* 마무리 */
.ending{text-align:center}
.flash{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;animation:flash 1.2s forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.back-title{font-size:2rem;font-weight:800;color:var(--glow);text-shadow:0 0 18px rgba(94,230,200,.6);margin:14px 0 4px}
.stats{display:flex;justify-content:center;gap:10px;margin:10px 0 20px}
.stats div{background:var(--panel);border:1px solid var(--rim);border-radius:12px;padding:8px 14px;font-size:.8rem;color:var(--sub)}
.stats b{display:block;color:#fff;font-size:1.2rem}
.sign{background:#2b2116;border:3px solid #5a4630;border-radius:10px;padding:16px;margin:0 auto 10px;max-width:440px;font-weight:800;letter-spacing:.06em;color:#ffe6bf;font-size:1.05rem;min-height:60px}
.sign.glitch{animation:glitch .5s steps(2) 3}
@keyframes glitch{0%{transform:translate(0);filter:none}25%{transform:translate(-3px,1px);filter:hue-rotate(90deg)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,2px);filter:invert(.2)}}
.scene{color:var(--sub);font-size:.85rem;margin-bottom:18px}
.quote{font-family:'Gowun Batang',serif;font-size:1.25rem;line-height:1.6;color:#fff;margin:18px auto;max-width:460px;opacity:0;animation:fadein 1s 2.4s forwards}
.quote small{display:block;color:var(--sub);font-size:.85rem;margin-top:4px}
.bfly{font-size:3.2rem;opacity:0;animation:fadein 1s 1.8s forwards}
.discuss{background:var(--paper);color:var(--ink);border-radius:16px;padding:20px;margin-top:10px;opacity:0;animation:fadein 1s 3.4s forwards}
.discuss .m-label{font-size:.8rem}
.discuss h3{font-family:'Gowun Batang',serif;font-size:1.3rem;margin:6px 0}
.discuss p{color:var(--muted);font-size:.88rem}
.think-more{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;text-align:left}
.think-more p{font-family:'Gowun Batang',serif;color:var(--ink);font-size:.98rem;line-height:1.5;margin-top:8px}
.think-more b{display:block;font-family:'Nanum Square Round';font-size:.72rem;color:#5b7bb5;letter-spacing:.05em}
@keyframes fadein{to{opacity:1}}
/* 정리 단계 */
.review-panel{background:var(--panel);border:2px solid var(--glow-d);border-radius:18px;padding:16px;margin:4px 0 12px;box-shadow:0 0 24px rgba(94,230,200,.12)}
.rv-head{font-weight:800;font-size:1.08rem;margin-bottom:2px}
.rv-sub{color:var(--sub);font-size:.85rem;margin-bottom:14px}
.rv-step{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.rv-step h4{font-size:.95rem;margin-bottom:4px}
.rv-step .sub-hint{margin-bottom:10px}
.sum-line{font-family:'Gowun Batang',serif;font-size:1.12rem;line-height:2.1;margin-bottom:12px}
.blank{display:inline-block;min-width:96px;text-align:center;border-bottom:3px solid var(--orange);color:#b5a99c;padding:0 8px;line-height:1.5;font-family:'Share Tech Mono'}
.blank.fill{background:#fff4e6;border-radius:8px 8px 0 0;color:var(--ink);font-weight:800;cursor:pointer;font-family:'Gowun Batang',serif}
.wchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.wchip{padding:9px 16px;border-radius:30px;border:2px solid var(--orange);background:#fff;color:var(--ink);font-weight:800}
.wchip.used{opacity:.25;pointer-events:none}
.sum-card{background:#f2fbf5;border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--ink);box-shadow:inset 0 0 0 2px #9fe0bd}
.sum-card .lb{font-size:.75rem;font-weight:800;color:#1e9e5a;margin-bottom:4px}
.sum-card .en{font-family:'Gowun Batang',serif;font-size:1.05rem;line-height:1.6;font-weight:700}
.sum-card .ko{color:var(--muted);font-size:.9rem;margin-top:6px;line-height:1.5}
.crew-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.crew-row span{padding:5px 12px;border-radius:20px;font-size:.85rem;font-weight:800;background:#f3ede2;color:var(--muted)}
.crew-row span.ok{background:#dff6e9;color:#1e9e5a}
.crew-row span.now{background:var(--orange);color:#fff}
.chk-q{font-family:'Gowun Batang',serif;font-size:1.15rem;font-weight:700;line-height:1.5;margin:8px 0 14px}
.chk-btns{display:flex;gap:10px}
.chk-btns button{flex:1;padding:16px;border-radius:14px;font-size:1.6rem;font-weight:800;color:#fff}
.chk-btns .o{background:#3b82f6;box-shadow:0 4px 0 #1f5fcf}
.chk-btns .x{background:#ef4444;box-shadow:0 4px 0 #b52a2a}
.chk-btns button:active{transform:translateY(3px);box-shadow:none}
.chk-btns button[disabled]{opacity:.5}
.fb{border-radius:12px;padding:12px 14px;margin-bottom:10px}
.fb.good{background:#dff6e9;color:#14683c}
.fb.bad{background:#ffe9e6;color:#8c2a20}
.fb b{font-size:1.05rem}
.fb .st{font-family:'Gowun Batang',serif;margin:6px 0;color:var(--ink)}
.fb .ev{background:#fff;border-left:4px solid var(--orange);padding:8px 10px;border-radius:6px;font-family:'Gowun Batang',serif;color:var(--ink);margin-top:6px;line-height:1.5}

.credit{margin-top:14px;text-align:center;font-size:.75rem;color:var(--sub);opacity:.8}

/* 바뀐 것 찾기 */
.card.picked{border-color:var(--orange);background:#fff4e6;font-weight:700}
.chain{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.arrow{font-size:1.8rem;color:var(--orange);font-weight:800;flex:none}
.results{flex:1;display:grid;gap:8px;min-width:0}
.chain>.link-slot{flex:1;min-width:0}
.link-slot{min-height:62px;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;color:#b5a99c;font-family:'Gowun Batang',serif;line-height:1.4}
.link-slot i{display:block;font-style:normal;font-family:'Nanum Square Round';font-size:.72rem;font-weight:800;color:var(--orange);margin-bottom:2px}
.link-slot.fill{border-style:solid;border-color:var(--orange);background:#fff7ee;color:var(--ink)}
.bf-card{margin-top:10px}
.think p.bg{font-family:'Nanum Square Round';font-size:.92rem;line-height:1.65;word-break:keep-all}
.ending-note{text-align:left;margin-top:12px;opacity:0;animation:fadein 1s 3.8s forwards}

/* 모둠 확인 */
.crew{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.crew span{display:inline-flex;align-items:center;gap:6px;background:#0f1520;border:1px solid var(--rim);border-radius:30px;padding:8px 14px;font-weight:800}
.crew i{font-style:normal;font-family:'Share Tech Mono';color:var(--brass);font-size:.8rem}

/* 모둠원 입력 */
.members{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.members .inp{padding:11px;font-size:.95rem}
.paper-form{background:var(--paper);color:var(--ink);border-radius:16px;padding:18px}
.paper-form h3{margin-bottom:6px}
.paper-form p{color:var(--muted);font-size:.88rem;margin-bottom:12px}
.paper-form .inp{background:#faf7f2;color:var(--ink);border-color:var(--line)}

/* 소리 내어 읽기 */
.read-panel{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--line)}
.rp-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rp-head b{font-size:1.05rem;flex:1}
.rp-count{font-family:'Share Tech Mono';color:var(--orange);font-weight:700;font-size:1.1rem}
.rp-bar{height:6px;background:#efe6d6;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.rp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--brass));transition:width .4s}
.rp-desc{font-size:.85rem;color:var(--muted);margin-bottom:12px;line-height:1.5}
.sent{display:flex;gap:10px;padding:10px 8px;border-radius:12px;align-items:flex-start}
.sent i{font-style:normal;font-family:'Share Tech Mono';color:#b5a99c;min-width:20px;padding-top:3px}
.sent .tx{flex:1;font-family:'Gowun Batang',serif;line-height:1.6}
.sent .who{font-size:.75rem;font-weight:800;color:#b5a99c;white-space:nowrap;padding-top:4px}
.sent.done{opacity:.55}
.sent.done .who{color:#1e9e5a}
.sent.todo .tx{color:#a39686}
.sent.cur{background:#fff4e6;box-shadow:inset 0 0 0 2px var(--orange);margin:6px 0;padding:14px 12px}
.sent.cur .tx{font-size:1.18rem;font-weight:700;color:var(--ink)}
.sent.cur i{color:var(--orange)}
.turn{display:inline-block;background:var(--orange);color:#fff;border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:800;margin-bottom:6px}
.recbox{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:30px;background:#e5484d;color:#fff;font-weight:800;font-size:1rem;box-shadow:0 4px 0 #a92d31}
.rec-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a92d31}
.rec-btn.on{background:#2b2b2b;box-shadow:0 4px 0 #000;animation:recpulse 1.2s infinite}
.rec-btn .dotr{width:12px;height:12px;border-radius:50%;background:#fff}
.rec-btn.on .dotr{background:#ff4d4d;border-radius:2px}
@keyframes recpulse{50%{box-shadow:0 4px 0 #000,0 0 0 8px rgba(229,72,77,.25)}}
.recbox audio{height:38px;max-width:100%}
.recbox .btn{padding:10px 14px;font-size:.92rem}
.recbox .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.warn{width:100%;font-size:.85rem;color:#c0392b;font-weight:700}
.tip{width:100%;font-size:.78rem;color:var(--muted)}
.locked-m{background:rgba(255,255,255,.04);border:2px dashed var(--rim);border-radius:14px;padding:14px;color:var(--sub);text-align:center;font-size:.9rem}
details.ptext{background:var(--paper);color:var(--ink);border-radius:14px;margin-bottom:14px;border-left:6px solid var(--orange)}
details.ptext summary{padding:12px 16px;font-weight:800;cursor:pointer}
details.ptext div{padding:0 18px 16px;font-family:'Gowun Batang',serif;line-height:1.85;word-break:keep-all}
.hidden{display:none!important}
@media (max-width:420px){
  .node{width:30px;height:30px;font-size:.8rem}
  .slots{grid-template-columns:repeat(3,1fr)}
  .slot{word-break:normal}
  .chain{flex-direction:column;align-items:stretch}
  .arrow{transform:rotate(90deg);text-align:center;line-height:1}
  .m-row{flex-direction:column}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
var BOOT = null;          // 스테이션·미션 정보 (정답 없음)
var S = null;             // 서버에서 받은 모둠 상태
var syncedAt = 0;         // S를 받은 시각 (타이머 계산용)
var viewNo = null;        // 다시 보는 스테이션 번호 (null이면 지금 스테이션)
var busy = false;
var draft = {};           // 입력 중인 답 (다시 그려도 유지)
var finalPick = [];       // 최종 암호 슬롯에 놓은 열쇠 단어
var finalTyping = false;
var finalHint = '';
var codeTry = '';         // 입장 중인 모둠 코드
var pollTimer = null, tickTimer = null;

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

// Apps Script 밖(GitHub Pages)에서 열면 google.script.run이 없으므로, 주소의 ?api=(선생님 앱 주소)로 요청을 보냄
var IN_GAS = !!(window.google && google.script && google.script.run);
var API = '';
if (!IN_GAS) {
  try { API = new URLSearchParams(location.search).get('api') || ''; } catch (e) {}
  if (API) lsSet('tm8_api', API); else API = lsGet('tm8_api') || '';
}
// 같은 기기를 여러 선생님 앱이 함께 써도 모둠 기록이 섞이지 않게 앱 주소별로 따로 기억
var STORE = 'tm8_team' + (API ? '|' + API : '');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }

function call(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (IN_GAS) {
    return new Promise(function (ok, fail) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { fail(e); });
      r[name].apply(r, args);
    });
  }
  if (!API) return Promise.reject(new Error('앱 주소가 없어요. 선생님께 받은 주소로 다시 열어 주세요.'));
  // text/plain으로 보내야 브라우저가 사전 확인(preflight) 없이 Apps Script로 보낼 수 있음
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn: name, args: args }) })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      var out;
      try { out = JSON.parse(text); }
      catch (e) { throw new Error('선생님 앱에 연결할 수 없어요. 배포 액세스 권한이 "모든 사용자"인지 선생님께 알려 주세요.'); }
      if (!out.ok) throw new Error(out.error);
      return out.result;
    }, function (e) {
      if (e && e.message && /선생님 앱|앱 주소/.test(e.message)) throw e;
      throw new Error('인터넷 연결을 확인하고 다시 눌러 주세요.');
    });
}
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, 2800);
}
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }

/** 같은 스테이션이면 매번 같은 순서로 섞이게 (다시 그려도 카드가 안 움직임) */
function shuffled(arr, seed) {
  var a = arr.map(function (x, i) { return i; }), s = 0;
  for (var i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  for (var j = a.length - 1; j > 0; j--) { s = (s * 1103515245 + 12345) >>> 0; var k = s % (j + 1); var t = a[j]; a[j] = a[k]; a[k] = t; }
  if (a.every(function (x, i) { return x === i; })) a.push(a.shift());   // 정답 순서 그대로 나오지 않게
  return a;
}

function waitLeft() { return S ? Math.max(0, S.wait - Math.floor((Date.now() - syncedAt) / 1000)) : 0; }
function elapsedNow() { return S ? S.elapsed + (S.finished ? 0 : Math.floor((Date.now() - syncedAt) / 1000)) : 0; }
function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

function setState(st) {
  var before = S;
  if (!before || before.station !== st.station) { sumPick = []; checkFb = null; chFind = []; chLink = []; }
  S = st; syncedAt = Date.now();
  lsSet(STORE, { code: S.code });
  return before;
}

// ===== 시작 =====
function init() {
  $('app').innerHTML = '<div class="intro"><div class="console"><div class="gauge"><span></span></div><p class="note mono">BOOTING...</p></div></div>';
  call('getBoot').then(function (b) {
    BOOT = b;
    var saved = lsGet(STORE);
    if (saved && saved.code) {
      call('checkCode', saved.code).then(function (st) {
        if (st) { setState(st); startGame(); } else { lsDel(STORE); renderIntro(); }
      }).catch(function () { renderIntro(); });
    } else renderIntro();
  }).catch(function (e) {
    $('app').innerHTML = '<div class="intro"><div class="console"><h1>연결 오류</h1><p class="story">' + esc(errMsg(e)) + '</p><button class="btn brass full" onclick="init()">다시 시도</button></div></div>';
  });
}

function renderIntro(step) {
  var nameStep = step === 'name';
  $('app').innerHTML =
    '<div class="intro"><div class="console">' +
      '<div class="gauge"><span></span></div>' +
      '<p class="eyebrow">LESSON 8 · TIME MACHINE REPAIR</p>' +
      '<h1>타임머신 수리 미션</h1>' +
      '<p class="story">시간 여행에서 돌아온 타임머신이 고장 났다.<br>6개 구역의 단서를 풀어 <b style="color:var(--brass)">열쇠 단어 6개</b>를 모아야<br>"현재"로 돌아갈 수 있다.</p>' +
      (nameStep
        ? '<div class="field"><label>모둠 코드</label><div class="inp mono" style="opacity:.6">' + esc(codeTry) + '</div></div>' +
          '<div class="field"><label>모둠 이름</label><input id="nameIn" class="inp" maxlength="20" placeholder="예: 시간여행자들" autocomplete="off"></div>' +
          '<div class="field"><label>모둠원 이름 (이 순서대로 돌아가며 소리 내어 읽어요)</label>' + memberInputs() + '</div>' +
          '<button id="goBtn" class="btn brass full" onclick="doJoin()">🚀 탑승하기</button>' +
          '<p class="note"><a class="link" onclick="renderIntro()">← 코드 다시 입력</a></p>'
        : '<div class="field"><label>모둠 코드</label><input id="codeIn" class="inp mono" maxlength="20" placeholder="예: 3-2  (반-모둠)" autocomplete="off"></div>' +
          '<button id="goBtn" class="btn brass full" onclick="doCode()">다음</button>' +
          '<p class="note">선생님이 알려 준 모둠 코드를 입력하세요.<br>같은 코드로 다시 들어오면 이어서 할 수 있어요.</p>') +
      '<p class="credit">made by Quokka 쌤</p>' +
    '</div></div>';
  var inp = $(nameStep ? 'nameIn' : 'codeIn');
  inp.focus();
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') (nameStep ? doJoin : doCode)(); });
}

function doCode() {
  var code = $('codeIn').value.trim();
  if (!code) { toast('모둠 코드를 입력해 주세요.'); return; }
  $('goBtn').disabled = true;
  call('checkCode', code).then(function (st) {
    if (st) renderConfirm(st);
    else { codeTry = code.replace(/\s+/g, '').toUpperCase(); renderIntro('name'); }
  }).catch(function (e) { toast(errMsg(e)); $('goBtn').disabled = false; });
}

/** 이미 있는 모둠 코드: 모둠원을 보여 주고 우리 모둠이 맞는지 확인 */
function renderConfirm(st) {
  var where = st.finished ? '🏁 탈출 성공' : st.station > 6 ? '🔐 최종 암호 단계' : st.station + '구역 진행 중';
  $('app').innerHTML =
    '<div class="intro"><div class="console">' +
      '<p class="eyebrow">이미 탑승한 모둠이에요</p>' +
      '<h1>' + esc(st.name) + '</h1>' +
      '<p class="note mono" style="margin-top:0">' + esc(st.code) + ' · ' + where + '</p>' +
      '<div class="crew">' + (st.members.length
        ? st.members.map(function (m, i) { return '<span><i>' + (i + 1) + '</i>' + esc(m) + '</span>'; }).join('')
        : '<p class="note">모둠원 이름이 아직 없어요.</p>') + '</div>' +
      '<p class="story" style="margin:14px 0 16px">우리 모둠이 맞나요?</p>' +
      '<button class="btn brass full" id="goBtn">✅ 맞아요, 이어서 하기</button>' +
      '<p class="note"><a class="link" onclick="renderIntro()">← 아니에요, 코드 다시 입력</a></p>' +
    '</div></div>';
  $('goBtn').onclick = function () { setState(st); startGame(); };
}

function memberInputs(list) {
  var h = '<div class="members">';
  for (var i = 0; i < 4; i++) h += '<input class="inp mem" maxlength="12" placeholder="' + (i + 1) + '번' + (i < 2 ? '' : ' (없으면 비움)') + '" value="' + esc((list || [])[i] || '') + '" autocomplete="off">';
  return h + '</div>';
}
function readMembers() {
  return Array.prototype.map.call(document.querySelectorAll('.mem'), function (el) { return el.value.trim(); }).filter(Boolean);
}

function doJoin() {
  var name = $('nameIn').value.trim();
  var members = readMembers();
  if (!name) { toast('모둠 이름을 입력해 주세요.'); return; }
  if (members.length < 2) { toast('모둠원 이름을 2명 이상 입력해 주세요.'); return; }
  $('goBtn').disabled = true;
  call('join', codeTry, name, members).then(function (st) { setState(st); startGame(); })
    .catch(function (e) { toast(errMsg(e)); $('goBtn').disabled = false; });
}

function saveMembers() {
  var members = readMembers();
  if (members.length < 2) { toast('모둠원 이름을 2명 이상 입력해 주세요.'); return; }
  call('setMembers', S.code, members).then(function (st) { setState(st); render(); }).catch(function (e) { toast(errMsg(e)); });
}

function startGame() {
  render();
  clearInterval(pollTimer); clearInterval(tickTimer);
  pollTimer = setInterval(poll, 8000);
  tickTimer = setInterval(tick, 1000);
}

function poll() {
  if (busy || !S) return;
  call('getState', S.code).then(function (st) {
    var before = setState(st);
    // 상태가 바뀌었을 때만 다시 그림 (입력 중인 글자가 지워지지 않게)
    var sig = function (x) { return [x.station, x.paused, x.maxStation, x.finished, x.wait > 0, x.readMode, JSON.stringify(x.solved), JSON.stringify(x.read), JSON.stringify(x.review), JSON.stringify(x.changes), JSON.stringify(x.members), JSON.stringify(x.sentences)].join('|'); };
    if (!before || sig(before) === sig(st)) return;
    if (rec.status !== 'idle') {
      // 녹음 중이거나 들어 보는 중에는, 같은 문장을 읽고 있는 한 다시 그리지 않음
      var same = before.station === st.station && (before.read[st.station] || 0) === (st.read[st.station] || 0) && !st.paused;
      if (same || rec.status === 'up') return;
      if (rec.status === 'rec') { clearInterval(rec.timer); rec.recorder.onstop = null; rec.recorder.stop(); }
      if (rec.url) URL.revokeObjectURL(rec.url);
      rec = { status: 'idle' };
    }
    render();
  }).catch(function (e) {
    if (/찾을 수 없/.test(errMsg(e))) { lsDel(STORE); S = null; clearInterval(pollTimer); clearInterval(tickTimer); renderIntro(); toast('선생님이 모둠 기록을 지웠어요. 다시 입장해 주세요.'); }
  });
}

function tick() {
  if (!S) return;
  var c = $('clock'); if (c) c.textContent = fmt(elapsedNow());
  var fb = $('fbNext');
  if (fb && fb.disabled && checkFb && !checkFb.correct) {
    var wait = 4 - Math.floor((Date.now() - checkFb.at) / 1000);
    if (wait <= 0) { fb.disabled = false; fb.textContent = '다시 풀기 →'; }
    else fb.textContent = '근거 문장 읽는 중… ' + wait;
  }
  var cb = $('chkBtn');
  if (cb && cb.disabled && !busy) {
    var left = Math.ceil(minSeconds(cb.dataset.text) - (Date.now() - shownAt) / 1000);
    if (left <= 0) { cb.disabled = false; cb.textContent = '✅ 다 읽었어요'; }
    else cb.textContent = '읽는 중… ' + left;
  }
  var w = waitLeft(), sec = $('coolSec');
  if (sec) {
    if (w > 0) sec.textContent = w;
    else render();
  }
}

// ===== 화면 그리기 =====
function render() {
  if (!S) return;
  if (S.finished) { renderEnding(); return; }
  if (viewNo != null && viewNo >= S.station) viewNo = null;
  var html = dashHtml();
  if (S.paused) html += gateHtml('🔒', '선생님이 잠시 멈춤을 걸었어요', '선생님 설명을 들어 주세요. 곧 다시 열려요.');
  else if (viewNo != null) html += stationHtml(viewNo, true);
  else if (S.station > S.maxStation) html += gateHtml('⏳', (S.station > 6 ? '최종 암호 장치가' : S.station + '구역이') + ' 아직 잠겨 있어요', '선생님이 열어 줄 때까지 앞 구역을 다시 살펴보며 기다려요.');
  else if (S.station > 6) html += finalHtml();
  else html += stationHtml(S.station, false);
  $('app').innerHTML = '<div class="wrap">' + html + '</div>';
  bindInputs();
  if (readingHtml.scroll) {
    readingHtml.scroll = false;
    var c = $('curSent');
    if (c && (S.read[S.station] || 0) > 0) c.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

function dashHtml() {
  var cur = viewNo != null ? viewNo : S.station;
  var track = '';
  for (var i = 1; i <= 7; i++) {
    var cls = i < S.station ? 'done' : (i === S.station ? 'cur' : '');
    if (viewNo === i) cls += ' view';
    var label = i === 7 ? '🔐' : i;
    var click = i < S.station ? ' onclick="openReview(' + i + ')"' : (i === S.station ? ' onclick="openReview(null)"' : '');
    track += (i > 1 ? '<div class="wire' + (i <= S.station ? ' done' : '') + '"></div>' : '') +
      '<button class="node ' + cls + (i === 7 ? ' final' : '') + '"' + click + '>' + label + '</button>';
  }
  // 최종 암호 화면에서는 슬롯 글자를 가림 (슬롯 순서 = 이야기 순서라 정답이 그대로 보이므로)
  var mask = S.station > 6;
  var slots = '';
  for (var k = 0; k < 6; k++) {
    var got = S.keys[k];
    slots += '<div class="slot mono' + (got ? ' got' : '') + (got && dashHtml.fresh === k ? ' new' : '') + '">' + (got ? (mask ? '🔑' : esc(got)) : '?') + '</div>';
  }
  dashHtml.fresh = null;
  return '<div class="dash">' +
    '<div class="dash-top"><div class="team">⚙️ ' + esc(S.name) + '<small class="mono">' + esc(S.code) + '</small></div>' +
    '<div class="clock mono" id="clock">' + fmt(elapsedNow()) + '</div></div>' +
    '<div class="track">' + track + '</div>' +
    '<div class="slots">' + slots + '</div></div>';
}

function gateHtml(icon, title, sub) {
  return '<div class="gate"><div class="big">' + icon + '</div><h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p></div>';
}

function coolHtml() {
  var w = waitLeft();
  if (w <= 0) return '';
  return '<div class="cool"><div class="sec mono" id="coolSec">' + w + '</div>' +
    '<p><b>⚠️ 오답! 회로 과열</b><br>타임머신이 식을 때까지 기다려요. 그동안 지문을 다시 읽어 보세요.</p></div>';
}

function stationHtml(no, review) {
  var st = BOOT.stations[no - 1];
  var sents = S.sentences[no] || [];
  var html = '<div class="st-head"><span class="no mono">STATION ' + no + '</span><h2>' + esc(st.title) + '</h2><span class="pg">교과서 ' + st.page + '쪽</span>' +
    (review ? '<span class="review-tag">다시 보기</span>' : '') + '</div>';
  if (!review && !readDone(no)) {
    if (S.members.length < 2) return html + membersFormHtml();
    return html + readingHtml(no) + '<div class="locked-m">🔒 미션 2개는 소리 내어 읽기를 모두 마치면 열려요.</div>';
  }
  html += sents.length
    ? '<details class="ptext"' + (review ? ' open' : '') + '><summary>📖 본문 다시 보기 (' + st.page + '쪽)</summary><div>' + sents.map(esc).join(' ') + '</div></details>'
    : '<div class="passage paper">📄 교실의 <b>' + no + '번 스테이션</b>에 붙은 종이 지문(교과서 ' + st.page + '쪽)을 모둠이 함께 읽고 미션을 풀어요.</div>';
  if (!review) html += coolHtml();
  st.missions.forEach(function (m, i) { html += missionHtml(m, i, review || S.solved[m.id]); });
  if (!review && st.missions.every(function (m) { return S.solved[m.id]; })) {
    if (S.changes && !S.changes.linked) html += changesHtml(no);
    else {
      if (S.changes) html += changesResultHtml();
      if (S.review) html += reviewHtml(no);
    }
  }
  if (review && st.think) html += thinkHtml(st.think);
  if (review) html += '<div class="next-row"><button class="btn ghost" onclick="openReview(null)">지금 구역으로 →</button></div>';
  return html;
}

// ===== 6구역 바뀐 것 찾기 =====
var chFind = [];       // ① 고른 카드 id
var chLink = [];       // ② 연결 칸에 놓은 카드 id (0번 = 원인, 1·2번 = 결과)

function changesHtml(no) {
  var C = S.changes, dis = waitLeft() > 0 || busy;

    '<p class="rv-sub">Eckels가 현재로 돌아왔을 때 무엇이 달라졌을까요? 144쪽을 다시 살펴봐요.</p>';
  if (!C.found) {
    var order = shuffled(C.cards, S.code + 'changes');
    html += '<div class="rv-step" id="chStep"><h4>① 달라진 것·새로 발견한 것 3가지 고르기</h4>' +
      '<p class="sub-hint">본문에서 찾은 것 3개를 눌러요. 다시 누르면 빠져요.</p><div class="deck">' +
      order.map(function (i) {
        var c = C.cards[i];
        return '<button class="card' + (chFind.indexOf(c.id) >= 0 ? ' picked' : '') + '" onclick="chToggle(\'' + c.id + '\')">' + esc(c.t) + '</button>';
      }).join('') + '</div><div class="next-row"><button class="btn brass" onclick="sendChanges(\'find\')"' + (chFind.length === 3 && !dis ? '' : ' disabled') + '>확인</button></div></div>';
    return html + '</div>';
  }
  var slot = function (i, label) {
    var c = chLink[i] && C.foundCards.filter(function (x) { return x.id === chLink[i]; })[0];
    return '<div class="link-slot' + (c ? ' fill' : '') + '"' + (c ? ' onclick="chUnlink(' + i + ')"' : '') + '><i>' + label + '</i>' + (c ? esc(c.t) : '?') + '</div>';
  };
  html += '<div class="rv-step" id="chStep"><h4>② 원인 → 결과 연결하기</h4>' +
    '<p class="sub-hint">찾은 3가지 중 무엇이 <b>원인</b>이고 무엇이 <b>결과</b>일까요? 카드를 차례로 눌러 칸을 채워요. 놓은 카드를 누르면 빠져요.</p>' +
    '<div class="chain">' + slot(0, '원인') + '<div class="arrow">→</div><div class="results">' + slot(1, '결과') + slot(2, '결과') + '</div></div><div class="deck">' +
    C.foundCards.map(function (c) {
      return '<button class="card' + (chLink.indexOf(c.id) >= 0 ? ' used' : '') + '" onclick="chPlace(\'' + c.id + '\')">' + esc(c.t) + '</button>';
    }).join('') + '</div><div class="next-row"><button class="btn brass" onclick="sendChanges(\'link\')"' +
    (chLink[0] && chLink[1] && chLink[2] && !dis ? '' : ' disabled') + '>확인</button></div></div>';
  return html + '</div>';
}

function butterflyCardHtml() {
  var B = BOOT.butterfly;
  return '<div class="sum-card bf-card"><div class="lb">🦋 나비 효과</div><p class="en">' + esc(B.en) + '</p><p class="ko">' + esc(B.ko) + '</p></div>' +
    '<div class="think"><div class="m-label">📚 원작 이야기</div><p class="bg">' + esc(B.background) + '</p></div>';
}

function changesResultHtml() {
  var C = S.changes;
  return '<div class="review-panel"><div class="rv-head">🔍 바뀐 것 찾기 완료</div><div class="rv-step" style="margin-top:10px"><div class="chain">' +
    '<div class="link-slot fill"><i>원인</i>' + esc(C.cause) + '</div><div class="arrow">→</div><div class="results">' +
    C.effects.map(function (t) { return '<div class="link-slot fill"><i>결과</i>' + esc(t) + '</div>'; }).join('') + '</div></div></div>' +
    butterflyCardHtml() + '</div>';
}

function chToggle(id) {
  var i = chFind.indexOf(id);
  if (i >= 0) chFind.splice(i, 1); else if (chFind.length < 3) chFind.push(id);
  render();
}
function chPlace(id) {
  for (var i = 0; i < 3; i++) if (!chLink[i]) { chLink[i] = id; break; }
  render();
}
function chUnlink(i) { chLink[i] = null; render(); }

function sendChanges(step) {
  if (busy || waitLeft() > 0) return;
  busy = true;
  var picks = step === 'find' ? chFind.slice() : { cause: chLink[0], effects: [chLink[1], chLink[2]] };
  call('submitChanges', S.code, step, picks).then(function (r) {
    busy = false;
    var before = setState(r.state);
    if (step === 'find' && r.result !== 'blocked') chFind = [];
    if (step === 'link' && r.result !== 'blocked') chLink = [];
    render();
    if (r.result === 'wrong') {
      var b = $('chStep'); if (b) b.classList.add('shake');
      toast(step === 'find' ? '144쪽을 다시 읽어 봐요. 그대로인 것도 섞여 있어요.' : '무엇 때문에 다른 일들이 일어났을까요?');
    } else if (r.key) { dashHtml.fresh = before.keys.length; render(); showKey(r.key, CHANGE_STATION); }
    else if (r.message) toast(r.message);
  }).catch(function (e) { busy = false; render(); toast(errMsg(e)); });
}
var CHANGE_STATION = 6;

// ===== 정리 단계 =====
var sumPick = [];      // 요약 빈칸에 놓은 단어 카드 번호
var checkFb = null;    // 방금 푼 O/X 결과 (다음 사람으로 넘어가기 전까지 보여 줌)

function reviewHtml(no) {
  var R = S.review;
  var html = '<div class="review-panel" id="reviewPanel"><div class="rv-head">📝 ' + no + '구역 정리</div>' +

  if (!R.sum) {
    var order = shuffled(R.chips, S.code + 'sum' + no);
    var n = 0;
    var line = esc(R.template).replace(/\{(\d)\}/g, function (_, d) {
      var i = Number(d) - 1, p = sumPick[i];

      return p != null ? '<span class="blank fill" onclick="sumRemove(' + i + ')">' + esc(R.chips[p]) + '</span>' : '<span class="blank">' + d + '</span>';
    });
    var full = sumPick.filter(function (x) { return x != null; }).length === n;
    html += '<div class="rv-step" id="sumStep"><h4>① 함께 요약하기</h4><p class="sub-hint">빈칸에 알맞은 단어 카드를 골라 이 구역 내용을 한 줄로 정리해요. 놓은 카드를 누르면 빠져요.</p>' +
      '<p class="sum-line">' + line + '</p><div class="wchips">' +
      order.map(function (i) { return '<button class="wchip' + (sumPick.indexOf(i) >= 0 ? ' used' : '') + '" onclick="sumAdd(' + i + ')">' + esc(R.chips[i]) + '</button>'; }).join('') +
      '</div><div class="next-row"><button class="btn brass" onclick="sendSummary(' + no + ')"' + (full && waitLeft() <= 0 && !busy ? '' : ' disabled') + '>확인</button></div></div>';
    html += '<div class="locked-m">🔒 ② 1인 1문제는 요약을 완성하면 열려요.</div>';
    return html + '</div>';
  }
  html += '<div class="sum-card"><div class="lb">✅ 한 줄 정리</div><p class="en">' + esc(R.full) + '</p><p class="ko">' + esc(R.ko) + '</p></div>';
  html += '<div class="rv-step"><h4>② 1인 1문제 (' + R.done.length + ' / ' + S.members.length + ')</h4>' +
    '<div class="crew-row">' + S.members.map(function (m, i) {
      return '<span class="' + (i < R.done.length ? 'ok' : (R.item && i === R.done.length ? 'now' : '')) + '">' + (i < R.done.length ? '✅ ' : '') + esc(m) + '</span>';
    }).join('') + '</div>';
  if (checkFb) {
    var f = checkFb;
    html += '<div class="fb ' + (f.correct ? 'good' : 'bad') + '"><b>' + (f.correct ? '✅ ' + esc(f.member) + ' 정답!' : '❌ 아쉬워요, ' + esc(f.member)) + '</b>' +
      '<p class="st">' + esc(f.statement) + ' → 정답 <b>' + f.answer + '</b></p>' +
      '<div class="ev">📖 ' + esc(f.evidence) + '</div></div>' +
      '<div class="next-row"><button class="btn brass" id="fbNext" onclick="fbNext()"' + (f.correct ? '' : ' disabled') + '>' +
      (f.correct ? '다음 사람 →' : '근거 문장 읽는 중…') + '</button></div>';
    if (!f.correct) html += '<p class="sub-hint" style="margin-top:8px">근거 문장을 소리 내어 읽은 뒤, ' + esc(f.member) + '이(가) 다른 문제로 다시 풀어요.</p>';
  } else if (R.item) {
    html += '<p class="sub-hint">🙋 <b style="color:var(--orange)">' + esc(R.item.member) + '</b> 차례예요. <b>혼자</b> 풀어요! 다른 모둠원은 답을 알려 주지 않기.</p>' +
      '<p class="chk-q">' + esc(R.item.s) + '</p>' +
      '<div class="chk-btns"><button class="o" onclick="sendCheck(' + no + ',\'O\')"' + (busy ? ' disabled' : '') + '>O</button>' +
      '<button class="x" onclick="sendCheck(' + no + ',\'X\')"' + (busy ? ' disabled' : '') + '>X</button></div>';
  }
  return html + '</div></div>';
}

function sumAdd(i) {
  if (sumPick.indexOf(i) >= 0) return;
  var n = (S.review.template.match(/\{\d\}/g) || []).length;
  for (var k = 0; k < n; k++) if (sumPick[k] == null) { sumPick[k] = i; break; }
  render();
}
function sumRemove(k) { sumPick[k] = null; render(); }

function sendSummary(no) {
  if (busy || waitLeft() > 0) return;
  busy = true;
  var picks = sumPick.map(function (i) { return S.review.chips[i]; });
  call('submitSummary', S.code, no, picks).then(function (r) {
    busy = false;
    var before = setState(r.state);
    if (r.result === 'wrong') {
      sumPick = []; render();
      var b = $('sumStep'); if (b) b.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate(200);
    } else {
      sumPick = []; render();
      if (r.key) { dashHtml.fresh = before.keys.length; render(); showKey(r.key, no); }
      else if (r.result === 'correct') toast('✅ 요약 완성! 이제 한 사람씩 문제를 풀어요.');
      if (r.message) toast(r.message);
    }
  }).catch(function (e) { busy = false; render(); toast(errMsg(e)); });
}

function sendCheck(no, ans) {
  if (busy || !S.review || !S.review.item) return;
  busy = true; render();
  call('submitCheck', S.code, no, S.review.item.idx, ans).then(function (r) {
    busy = false;
    var before = setState(r.state);
    if (r.result === 'correct' || r.result === 'wrong') {
      if (r.key) {
        checkFb = null;
        dashHtml.fresh = before.keys.length; render(); showKey(r.key, no);
        return;
      }
      checkFb = { correct: r.result === 'correct', member: r.member, statement: r.statement, answer: r.answer, evidence: r.evidence, at: Date.now() };
    }
    render();
    if (r.message) toast(r.message);
  }).catch(function (e) { busy = false; render(); toast(errMsg(e)); });
}

function fbNext() { checkFb = null; render(); }

// ===== 소리 내어 읽기 =====
var rec = { status: 'idle' };   // idle → rec(녹음 중) → done(들어 보기) → up(보내는 중)
var micStream = null;
var shownAt = Date.now();        // 지금 문장이 화면에 나온 시각 (확인 버튼 모드 최소 시간)
var curKey = '';

function readDone(no) { return S.readMode === 'off' || (S.read[no] || 0) >= (S.sentences[no] || []).length; }

/** 문장 길이에 맞는 최소 읽기 시간(초): 단어당 0.3초, 최소 1.5초 */
function minSeconds(text) {
  var words = String(text || '').split(/\s+/).filter(function (w) { return /[a-z]/i.test(w); }).length;
  return Math.max(1.5, Math.round(words * 0.3 * 10) / 10);
}

/** 읽을 사람: 스테이션이 바뀌어도 순서가 이어지도록 앞 스테이션 문장 수를 더해서 돌림 */
function readerOf(no, idx) {
  var offset = 0;
  for (var i = 1; i < no; i++) offset += (S.sentences[i] || []).length;
  return S.members[(offset + idx) % S.members.length];
}

function membersFormHtml() {
  return '<div class="paper-form"><h3>👥 모둠원 이름</h3><p>이 순서대로 돌아가며 한 문장씩 소리 내어 읽어요.</p>' +
    memberInputs(S.members) + '<button class="btn brass full" style="margin-top:12px" onclick="saveMembers()">저장</button></div>';
}

function readingHtml(no) {
  var sents = S.sentences[no], cur = S.read[no] || 0;
  var key = no + '-' + cur;
  if (key !== curKey) { curKey = key; shownAt = Date.now(); readingHtml.scroll = true; }
  var html = '<div class="read-panel"><div class="rp-head"><b>🎙 소리 내어 읽기</b><span class="rp-count">' + cur + ' / ' + sents.length + '</span></div>' +
    '<div class="rp-bar"><i style="width:' + Math.round(cur / sents.length * 100) + '%"></i></div>' +
    '<p class="rp-desc">모둠원이 돌아가며 한 문장씩 또박또박 읽어요. ' +
    (S.readMode !== 'record' ? '읽은 사람이 아닌 다른 모둠원이 확인 버튼을 눌러요.'
      : S.saveMode === 'none' ? '녹음은 들어 보고 확인하는 데만 써요.'
      : S.saveMode === 'all' ? '녹음은 선생님이 들을 수 있어요.'
      : '모둠원마다 이 구역의 첫 문장 녹음은 선생님이 들을 수 있어요.') + '</p>';
  sents.forEach(function (s, i) {
    var cls = i < cur ? 'done' : i === cur ? 'cur' : 'todo';
    var who = readerOf(no, i);
    html += '<div class="sent ' + cls + '"' + (i === cur ? ' id="curSent"' : '') + '><i>' + (i + 1) + '</i><div class="tx">' +
      (i === cur ? '<span class="turn">🎤 ' + esc(who) + ' 차례</span><br>' : '') + esc(s) +
      (i === cur ? recBoxHtml(s) : '') + '</div>' +
      (i !== cur ? '<span class="who">' + (i < cur ? '✅ ' : '') + esc(who) + '</span>' : '') + '</div>';
  });
  return html + '</div>';
}

function recBoxHtml(text) {
  if (S.readMode === 'check') {
    return '<div class="recbox"><button class="btn brass" id="chkBtn" data-text="' + esc(text) + '" onclick="checkSend()" disabled>읽는 중…</button>' +
      '<span class="tip">읽은 사람이 아닌 다른 모둠원이 들어 보고 눌러 주세요.</span></div>';
  }
  if (rec.status === 'rec') {
    return '<div class="recbox"><button class="rec-btn on" onclick="recStop()"><span class="dotr"></span>그만 <span class="mono" id="recSec">0.0</span>초</button>' +
      '<span class="tip">끝까지 읽은 뒤 [그만]을 눌러요.</span></div>';
  }
  if (rec.status === 'done' || rec.status === 'up') {
    var short = rec.seconds < minSeconds(text);
    var up = rec.status === 'up';
    return '<div class="recbox"><audio controls src="' + rec.url + '"></audio>' +
      (short ? '<span class="warn">⚠️ 너무 짧아요 (' + rec.seconds.toFixed(1) + '초). 문장을 끝까지 읽어 주세요.</span>' : '') +
      '<button class="btn ghost" onclick="recReset()"' + (up ? ' disabled' : '') + '>↺ 다시 녹음</button>' +
      '<button class="btn brass" onclick="recSend()"' + (short || up ? ' disabled' : '') + '>' + (up ? '보내는 중…' : '✅ 인증 보내기') + '</button>' +
      '<span class="tip">한번 들어 보고, 잘 읽었으면 인증을 보내요.' + (willSave(S.read[S.station] || 0) ? ' 🎧 이 녹음은 선생님께 저장돼요.' : '') + '</span></div>';
  }
  return '<div class="recbox"><button class="rec-btn" onclick="recStart()"><span class="dotr"></span>녹음 시작</button></div>';
}

function pickMime() {
  var list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}

function getMic() {
  if (micStream && micStream.getAudioTracks().some(function (t) { return t.readyState === 'live'; })) return Promise.resolve(micStream);
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(function (s) { micStream = s; return s; });
}

function recStart() {
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('이 기기에서는 녹음을 할 수 없어요. 선생님께 알려 주세요.'); return;
  }
  getMic().then(function (stream) {
    var mime = pickMime();
    // 말소리용으로 작게 (시트 칸에 나눠 저장하므로 20초 안쪽이 들어가게)
    var mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 12000 } : undefined);
    var chunks = [];
    mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = function () {
      var blob = new Blob(chunks, { type: mr.mimeType || mime || 'audio/webm' });
      rec = { status: 'done', blob: blob, url: URL.createObjectURL(blob), seconds: (Date.now() - rec.t0) / 1000, mime: blob.type };
      render();
    };
    rec = { status: 'rec', recorder: mr, t0: Date.now() };
    mr.start();
    render();
    rec.timer = setInterval(function () {
      var el = $('recSec'), sec = (Date.now() - rec.t0) / 1000;
      if (el) el.textContent = sec.toFixed(1);
      if (sec >= 20) { recStop(); toast('20초가 넘어서 녹음을 멈췄어요.'); }
    }, 100);
  }).catch(function () {
    // Apps Script 화면은 구글의 틀(iframe) 안이라 마이크가 막혀 있음 → 녹음용 주소로 열어야 함
    var blocked = document.featurePolicy && document.featurePolicy.allowsFeature && !document.featurePolicy.allowsFeature('microphone');
    toast(IN_GAS || blocked
      ? '이 주소에서는 녹음이 막혀 있어요. 선생님께 받은 녹음용 주소로 열어 주세요.'
      : '마이크를 쓸 수 없어요. 크롬 주소창 왼쪽의 설정에서 마이크를 허용해 주세요.');
  });
}

function recStop() {
  if (rec.status !== 'rec') return;
  clearInterval(rec.timer);
  rec.recorder.stop();
}

function recReset() {
  if (rec.url) URL.revokeObjectURL(rec.url);
  rec = { status: 'idle' };
  render();
}

/** 이 문장 녹음을 선생님 시트에 저장하는지 (서버의 shouldSave_와 같은 기준) */
function willSave(idx) {
  if (S.readMode !== 'record' || S.saveMode === 'none') return false;
  return S.saveMode === 'all' || idx < Math.max(1, S.members.length);
}

function recSend() {
  if (rec.status !== 'done') return;
  var no = S.station, idx = S.read[no] || 0, reader = readerOf(no, idx);
  var r = rec;
  rec.status = 'up'; render();
  var send = function (data) {
    call('submitReading', S.code, no, idx, reader, { data: data, mime: r.mime, seconds: r.seconds })
      .then(afterReading)
      .catch(function (e) { rec.status = 'done'; render(); toast(errMsg(e)); });
  };
  // 저장하지 않는 문장은 길이만 보내고 녹음 내용은 올리지 않음
  if (!willSave(idx)) { send(''); return; }
  var fr = new FileReader();
  fr.onload = function () { send(String(fr.result).split(',')[1]); };
  fr.readAsDataURL(r.blob);
}

function checkSend() {
  if (busy) return;
  var no = S.station, idx = S.read[no] || 0;
  busy = true;
  var b = $('chkBtn'); if (b) b.disabled = true;
  call('submitReading', S.code, no, idx, readerOf(no, idx), null)
    .then(function (r) { busy = false; afterReading(r); })
    .catch(function (e) { busy = false; render(); toast(errMsg(e)); });
}

function afterReading(r) {
  if (rec.url) URL.revokeObjectURL(rec.url);
  rec = { status: 'idle' };
  setState(r.state);
  if (r.message) toast(r.message);
  var no = S.station;
  if (r.result === 'ok' && readDone(no)) toast('📖 다 읽었어요! 이제 미션이 열렸어요.');
  render();
}

function thinkHtml(q) {
  return '<div class="think"><div class="m-label">💬 THINK · 모둠 토론</div><p>' + esc(q) + '</p><small>정답 입력 없이 모둠끼리 이야기 나눠 보세요.</small></div>';
}

function savedAnswers() { return (lsGet('tm8_ans_' + S.code) || {}); }

function missionHtml(m, i, done) {
  var head = '<div class="m-label">MISSION ' + (i + 1) + (done ? ' · 해결 ✅' : '') + '</div>';
  var q = '<p class="m-q">' + esc(m.q) + '</p>';
  if (done) {
    var mine = savedAnswers()[m.id];
    return '<div class="mission ok">' + head + q + '<div class="solved">✅ 회로 연결 완료' + (mine ? ' — <span>' + esc(mine) + '</span>' : '') + '</div></div>';
  }
  var dis = waitLeft() > 0 || busy ? ' disabled' : '';
  var body = '';
  if (m.type === 'text') {
    body = '<div class="m-row"><input class="inp" id="in_' + m.id + '" data-id="' + m.id + '" placeholder="영어로 답을 쓰세요" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(draft[m.id] || '') + '">' +
      '<button class="btn brass" onclick="submitText(\'' + m.id + '\')"' + dis + '>제출</button></div>';
  } else if (m.type === 'ox') {
    var cur = draft[m.id] || [];
    m.items.forEach(function (it, j) {
      body += '<div class="ox-item"><p><b>' + '①②③④⑤'[j] + '</b>' + esc(it) + '</p>' +
        '<button class="oxb o' + (cur[j] === 'O' ? ' on' : '') + '" onclick="pickOX(\'' + m.id + '\',' + j + ',\'O\')">O</button>' +
        '<button class="oxb x' + (cur[j] === 'X' ? ' on' : '') + '" onclick="pickOX(\'' + m.id + '\',' + j + ',\'X\')">X</button></div>';
    });
    var full = m.items.every(function (_, j) { return cur[j]; });
    body += '<div class="next-row"><button class="btn brass" onclick="submitOX(\'' + m.id + '\')"' + (full ? dis : ' disabled') + '>제출</button></div>';
  } else if (m.type === 'order') {
    var seq = draft[m.id] || [];
    var order = shuffled(m.items, S.code + m.id);
    body += '<p class="sub-hint">카드를 일어난 순서대로 누르세요. 놓은 카드를 누르면 빠져요.</p><div class="seq">';
    for (var s = 0; s < m.items.length; s++) {
      var idx = seq[s];
      body += idx != null
        ? '<div class="sl fill" onclick="unplace(\'' + m.id + '\',' + s + ')"><i>' + (s + 1) + '</i>' + esc(m.items[idx]) + '</div>'
        : '<div class="sl"><i>' + (s + 1) + '</i>…</div>';
    }
    body += '</div><div class="deck">';
    order.forEach(function (idx) {
      body += '<button class="card' + (seq.indexOf(idx) >= 0 ? ' used' : '') + '" onclick="place(\'' + m.id + '\',' + idx + ')">' + esc(m.items[idx]) + '</button>';
    });
    body += '</div><div class="next-row"><button class="btn brass" onclick="submitOrder(\'' + m.id + '\')"' + (seq.length === m.items.length ? dis : ' disabled') + '>제출</button></div>';
  }
  return '<div class="mission" id="m_' + m.id + '">' + head + q + body + '</div>';
}

function bindInputs() {
  Array.prototype.forEach.call(document.querySelectorAll('.m-row .inp'), function (el) {
    el.addEventListener('input', function () { draft[el.dataset.id] = el.value; });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitText(el.dataset.id); });
  });
  var fi = $('finalIn');
  if (fi) {
    fi.addEventListener('input', function () { draft.final = fi.value; });
    fi.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitFinal(); });
  }
}

function openReview(no) { viewNo = no; render(); window.scrollTo(0, 0); }

function pickOX(id, j, v) { var a = (draft[id] || []).slice(); a[j] = v; draft[id] = a; render(); }
function place(id, idx) { var a = (draft[id] || []).slice(); if (a.indexOf(idx) < 0) a.push(idx); draft[id] = a; render(); }
function unplace(id, s) { var a = (draft[id] || []).slice(); a.splice(s, 1); draft[id] = a; render(); }

function submitText(id) {
  var v = (draft[id] || '').trim();
  if (!v) { toast('답을 입력해 주세요.'); return; }
  send(id, v, v);
}
function submitOX(id) { send(id, (draft[id] || []).join(''), (draft[id] || []).join(' ')); }
function submitOrder(id) { send(id, (draft[id] || []).map(function (x) { return x + 1; }).join(''), '순서 맞추기 완료'); }

function send(id, answer, shown) {
  if (busy || waitLeft() > 0) return;
  busy = true;
  Array.prototype.forEach.call(document.querySelectorAll('.mission .btn'), function (b) { b.disabled = true; });
  call('submitMission', S.code, id, answer).then(function (r) {
    busy = false;
    var before = setState(r.state);
    if (r.result === 'correct') {
      var a = savedAnswers(); a[id] = shown; lsSet('tm8_ans_' + S.code, a);
      delete draft[id];
      if (r.key) { dashHtml.fresh = before.keys.length; render(); showKey(r.key, before.station); }
      else {
        render();
        var p = $('reviewPanel');
        if (p) { toast('✅ 미션 완료! 이제 정리 단계예요.'); p.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
        else toast('✅ 정답! 남은 미션도 풀어 보세요.');
      }
    } else if (r.result === 'wrong') {
      render();
      var box = $('m_' + id); if (box) box.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate(200);
    } else {
      render();
      if (r.message) toast(r.message);
    }
  }).catch(function (e) { busy = false; render(); toast(errMsg(e)); });
}

function showKey(key, no) {
  var st = BOOT.stations[no - 1];
  var ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal"><div class="ico">🔑</div><h3>' + no + '구역 수리 완료!</h3>' +
    '<div class="keyword mono">' + esc(key) + '</div>' +
    '<p>열쇠 단어를 얻었어요. (' + S.keys.length + ' / 6)</p>' +
    (st.think ? thinkHtml(st.think) : '') +
    '<button class="btn brass full" id="keyOk"></button></div>';
  document.body.appendChild(ov);
  // 기다리지 않고 자동으로 다음 구역으로 (토론 질문이 있는 구역은 조금 더 오래 보여 줌)
  var left = st.think ? 12 : 4;
  var label = no < 6 ? '다음 구역으로' : '최종 암호 장치로';
  var btn = $('keyOk');
  var close = function () { clearInterval(timer); if (ov.parentNode) ov.remove(); window.scrollTo(0, 0); };
  var show = function () { btn.textContent = label + ' → (' + left + '초 뒤 자동 이동)'; };
  var timer = setInterval(function () { left--; if (left <= 0) close(); else show(); }, 1000);
  show();
  btn.onclick = close;
}

// ===== 최종 암호 =====
function finalHtml() {
  var keys = S.keys;
  var order = shuffled(keys, S.code + 'final');
  var html = '<div class="st-head"><span class="no mono">FINAL</span><h2>최종 암호 장치</h2></div>' + coolHtml();
  if (finalHint) html += '<div class="hint">💡 ' + esc(finalHint) + '</div>';
  html += '<div class="final-panel"><h2>🔐 시간 좌표를 입력하라</h2>' +
    '<p class="desc">열쇠 단어 6개를 <b style="color:var(--brass)">이야기가 일어난 순서대로</b> 넣으면 타임머신이 "현재"로 돌아가요.</p>';
  if (!finalTyping) {
    html += '<div class="code-slots">';
    for (var i = 0; i < 6; i++) {
      var p = finalPick[i];
      html += p != null
        ? '<div class="cs fill mono" onclick="finalRemove(' + i + ')"><i>' + (i + 1) + '</i>' + esc(keys[p]) + '</div>'
        : '<div class="cs mono"><i>' + (i + 1) + '</i></div>';
    }
    html += '</div><div class="chips">';
    order.forEach(function (idx) {
      html += '<button class="chip mono' + (finalPick.indexOf(idx) >= 0 ? ' used' : '') + '" onclick="finalAdd(' + idx + ')">' + esc(keys[idx]) + '</button>';
    });
    html += '</div>';
  } else {
    html += '<div class="field"><label>쉼표나 띄어쓰기로 구분해서 입력</label>' +
      '<input id="finalIn" class="inp mono" placeholder="word1, word2, word3 ..." autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(draft.final || '') + '"></div>';
  }
  var ready = finalTyping ? true : finalPick.length === 6;
  var dis = (!ready || waitLeft() > 0 || busy) ? ' disabled' : '';
  html += '<div class="f-actions"><button class="btn ghost" onclick="toggleTyping()">' + (finalTyping ? '🧩 카드로 놓기' : '⌨️ 직접 입력') + '</button>' +
    '<button class="btn brass" onclick="submitFinal()"' + dis + '>⚡ 시간 이동</button></div></div>';
  return html;
}
function finalAdd(i) { if (finalPick.indexOf(i) < 0 && finalPick.length < 6) finalPick.push(i); render(); }
function finalRemove(s) { finalPick.splice(s, 1); render(); }
function toggleTyping() { finalTyping = !finalTyping; render(); }

function submitFinal() {
  if (busy || waitLeft() > 0) return;
  var answer = finalTyping ? (draft.final || '') : finalPick.map(function (i) { return S.keys[i]; }).join(', ');
  if (!answer.trim()) { toast('암호를 입력해 주세요.'); return; }
  busy = true; render();
  call('submitFinal', S.code, answer).then(function (r) {
    busy = false;
    setState(r.state);
    if (r.result === 'wrong') {
      finalHint = r.hint; finalPick = [];
      render();
      var p = document.querySelector('.final-panel'); if (p) p.classList.add('shake');
    } else { render(); if (r.message) toast(r.message); }
  }).catch(function (e) { busy = false; render(); toast(errMsg(e)); });
}

// ===== 마무리 (현재로 복귀 + 반전) =====
function renderEnding() {
  clearInterval(pollTimer); clearInterval(tickTimer);
  if (renderEnding.done) return;
  renderEnding.done = true;
  $('app').innerHTML = '<div class="flash"></div><div class="wrap ending">' +
    '<div style="font-size:2.6rem;margin-top:20px">⏱️</div>' +
    '<div class="back-title">현재로 복귀!</div>' +
    '<div class="stats"><div>걸린 시간<b class="mono">' + fmt(S.elapsed) + '</b></div><div>오답<b class="mono">' + S.wrong + '</b></div></div>' +
    '<p class="scene">그런데… 사무실 벽의 큰 간판이 이상하다.</p>' +
    '<div class="sign mono" id="sign">NAME ANY YEAR IN THE PAST.</div>' +
    '<p class="scene">TV 속 새 대통령도 Mr. Keith가 아니다.</p>' +
    '<div class="bfly">🦋</div>' +
    '<div class="quote">"No, it can\'t be. It\'s all because of this little thing?"<small>— Eckels</small></div>' +
    '<div class="discuss"><div class="m-label">💬 마무리 토론</div><h3>작은 나비 한 마리가 왜 미래를 바꿨을까?</h3><p>모둠끼리 이야기 나눈 뒤, 선생님과 함께 이야기해요.</p>' +
      '<div class="think-more">' + BOOT.stations.filter(function (s) { return s.think; }).map(function (s) {
        return '<p><b>THINK · ' + s.no + '구역</b>' + esc(s.think) + '</p>';
      }).join('') + '</div></div>' +
    '<div class="ending-note">' + butterflyCardHtml() + '<p class="credit">made by Quokka 쌤</p></div>' +
    '</div>';
  setTimeout(function () {
    var s = $('sign'); if (!s) return;
    s.classList.add('glitch'); s.textContent = 'NAIM ANY YEER EN THE PAST.';
  }, 1300);
}

init();
</script>
</body>
</html>
